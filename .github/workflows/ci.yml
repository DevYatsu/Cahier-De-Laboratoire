name: Build Typst + Deploy Website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Compile Typst → PDF
        run: |
          mkdir -p public
          typst compile main.typ public/cahier.pdf
          ls -lh public/

      - name: Generate website
        run: |
          typst compile --features html main.typ public/cahier.html
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="description" content="Cahier de laboratoire — lecture en ligne et téléchargement PDF.">
          <title>Cahier de laboratoire</title>
          <style>
            :root{
              --fond:#faf9f6; --carte:#ffffff; --texte:#23211d; --muted:#6f6a61;
              --bord:#e7e1d6; --accent:#2f5d3a; --accent-fonce:#23452b; --filet:#f0ebe0;
            }
            *{box-sizing:border-box}
            body{
              margin:0; font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
              background:
                radial-gradient(1200px 500px at 15% -10%, #efeadf 0%, transparent 60%),
                radial-gradient(900px 420px at 95% 0%, #e9eef0 0%, transparent 55%),
                var(--fond);
              color:var(--texte); min-height:100dvh;
            }
            header{
              border-bottom:1px solid var(--bord);
              background:rgba(255,255,255,.86); backdrop-filter:blur(10px);
              position:sticky; top:0; z-index:10;
            }
            .barre{
              max-width:1100px; margin:0 auto; padding:1rem 1.25rem;
              display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
            }
            .titre{margin:0}
            .titre span{display:block; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:.25rem}
            .titre strong{font-size:1.55rem; font-weight:650; letter-spacing:-.01em}
            .sous{font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:.9rem; color:var(--muted); margin:.3rem 0 0}
            .bouton{
              font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
              display:inline-flex; align-items:center; gap:.5rem;
              background:var(--accent); color:#fff; text-decoration:none;
              padding:.65rem 1.05rem; border-radius:999px; font-size:.95rem; font-weight:600;
              box-shadow:0 6px 18px rgba(47,93,58,.25);
              transition:transform .15s ease, background .15s ease;
              white-space:nowrap;
            }
            .bouton:hover{background:var(--accent-fonce); transform:translateY(-1px)}
            main{width:100%; max-width:1100px; margin:0 auto; padding:2rem 1.25rem 1rem}
            .doc{
              background:var(--carte); border:1px solid var(--bord); border-radius:16px;
              box-shadow:0 18px 50px rgba(30,28,24,.10);
              max-width:72ch; margin:0 auto; padding:3rem 3.25rem;
              font-size:1.075rem; line-height:1.75;
            }
            .doc h1{font-size:2rem; line-height:1.2; letter-spacing:-.015em; margin:0 0 .4rem}
            .doc h2{font-size:1.4rem; line-height:1.3; margin:2.2rem 0 .6rem; padding-top:1.2rem; border-top:1px solid var(--filet)}
            .doc h3{font-size:1.15rem; margin:1.6rem 0 .5rem}
            .doc p{margin:.8rem 0}
            .doc ul,.doc ol{margin:.8rem 0; padding-left:1.5rem}
            .doc li{margin:.35rem 0}
            .doc a{color:var(--accent); text-underline-offset:3px}
            .doc nav,.doc .sommaire{font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:.92rem; background:#fbf9f4; border:1px solid var(--filet); border-radius:12px; padding:1rem 1.25rem; margin:1.5rem 0}
            .doc nav ul,.doc .sommaire ul{margin:.4rem 0; padding-left:1.2rem}
            .secours{
              font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
              max-width:72ch; margin:1rem auto 0; font-size:.92rem; color:var(--muted); text-align:center;
            }
            .secours a{color:var(--accent); font-weight:600}
            footer{
              font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
              max-width:1100px; margin:0 auto; width:100%; padding:1rem 1.25rem 1.75rem;
              color:var(--muted); font-size:.85rem; display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;
            }
            @media (max-width:760px){
              .barre{padding:.9rem 1rem}
              .titre strong{font-size:1.3rem}
              main{padding:1rem .8rem}
              .doc{padding:1.6rem 1.25rem; font-size:1rem; line-height:1.7}
              .doc h1{font-size:1.6rem}
            }
          </style>
          </head>
          <body>
            <header>
              <div class="barre">
                <div>
                  <h1 class="titre"><span>Document</span><strong>Cahier de laboratoire</strong></h1>
                  <p class="sous">Version en ligne, mise en page pour une lecture confortable.</p>
                </div>
                <div>
                  <a class="bouton" href="cahier.pdf" download>Télécharger le PDF</a>
                </div>
              </div>
            </header>
            <main>
              <article class="doc">
          HTML
          sed 's/.*<body[^>]*//' public/cahier.html | sed 's|</body>.*||' >> public/index.html
          cat >> public/index.html <<'HTML'
              </article>
              <p class="secours">Version web générée depuis main.typ — le <a href="cahier.pdf" download>PDF reste disponible</a> pour impression et archivage.</p>
            </main>
            <footer>
              <span>Document compilé depuis main.typ</span>
              <span>Lecture confortable sur écran large comme sur mobile</span>
            </footer>
          </body>
          </html>
          HTML
          ls -lh public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
