name: Build Typst + Deploy Website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Compile Typst → PDF
        run: |
          mkdir -p public
          typst compile main.typ public/cahier.pdf
          ls -lh public/

      - name: Generate website
        run: |
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="description" content="Cahier de laboratoire — lecture en ligne et téléchargement PDF.">
          <title>Cahier de laboratoire</title>
          <style>
            :root{
              --fond:#faf9f6; --carte:#ffffff; --texte:#1e1c18; --muted:#6f6a61;
              --bord:#e7e1d6; --accent:#2f5d3a; --accent-fonce:#23452b;
            }
            *{box-sizing:border-box}
            html,body{height:100%}
            body{
              margin:0; font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
              background:
                radial-gradient(1200px 500px at 15% -10%, #efeadf 0%, transparent 60%),
                radial-gradient(900px 420px at 95% 0%, #e9eef0 0%, transparent 55%),
                var(--fond);
              color:var(--texte); display:flex; flex-direction:column; min-height:100dvh;
            }
            header{
              border-bottom:1px solid var(--bord);
              background:rgba(255,255,255,.82); backdrop-filter:blur(10px);
              position:sticky; top:0; z-index:10;
            }
            .barre{
              max-width:1100px; margin:0 auto; padding:1rem 1.25rem;
              display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
            }
            .titre{margin:0}
            .titre span{display:block; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:.25rem}
            .titre strong{font-size:1.55rem; font-weight:650; letter-spacing:-.01em}
            .actions{display:flex; align-items:center; gap:.75rem; flex-wrap:wrap}
            .sous{font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:.9rem; color:var(--muted); margin:0}
            .bouton{
              font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
              display:inline-flex; align-items:center; gap:.5rem;
              background:var(--accent); color:#fff; text-decoration:none;
              padding:.65rem 1.05rem; border-radius:999px; font-size:.95rem; font-weight:600;
              box-shadow:0 6px 18px rgba(47,93,58,.25);
              transition:transform .15s ease, background .15s ease;
            }
            .bouton:hover{background:var(--accent-fonce); transform:translateY(-1px)}
            main{flex:1; width:100%; max-width:1100px; margin:0 auto; padding:1.25rem; display:flex; flex-direction:column; gap:.8rem}
            .lecteur{
              flex:1; min-height:72dvh; background:var(--carte);
              border:1px solid var(--bord); border-radius:16px; overflow:hidden;
              box-shadow:0 18px 50px rgba(30,28,24,.10);
              display:flex; flex-direction:column;
            }
            iframe{width:100%; height:100%; min-height:72dvh; border:0; background:#fff; flex:1}
            .secours{
              font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
              padding:1.25rem; font-size:.95rem; color:var(--muted); text-align:center;
              border-top:1px dashed var(--bord); background:#fffdf8;
            }
            .secours a{color:var(--accent); font-weight:600}
            footer{
              font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
              max-width:1100px; margin:0 auto; width:100%; padding:0 1.25rem 1.5rem;
              color:var(--muted); font-size:.85rem; display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;
            }
            @media (max-width:640px){
              .barre{padding:.9rem 1rem}
              .titre strong{font-size:1.3rem}
              main{padding:.8rem}
              .lecteur, iframe{min-height:78dvh}
            }
          </style>
          </head>
          <body>
            <header>
              <div class="barre">
                <div>
                  <h1 class="titre"><span>Document</span><strong>Cahier de laboratoire</strong></h1>
                  <p class="sous">Version en ligne, mise en page pour une lecture confortable.</p>
                </div>
                <div class="actions">
                  <a class="bouton" href="cahier.pdf" download>Télécharger le PDF</a>
                </div>
              </div>
            </header>
            <main>
              <div class="lecteur">
                <iframe src="cahier.pdf" title="Cahier de laboratoire (PDF)"></iframe>
                <p class="secours">Le PDF ne s'affiche pas sur votre appareil ? <a href="cahier.pdf" download>Ouvrez ou téléchargez le document</a>.</p>
              </div>
            </main>
            <footer>
              <span>Document compilé depuis main.typ</span>
              <span>Lecture recommandée en plein écran sur mobile</span>
            </footer>
          </body>
          </html>
          HTML
          ls -lh public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
