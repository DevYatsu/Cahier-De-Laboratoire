name: Build Typst + Deploy Website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Compile Typst → PDF
        run: |
          mkdir -p public
          typst compile main.typ public/cahier.pdf
          ls -lh public/

      - name: Generate website
        run: |
          python3 scripts/build_site.py -o /tmp/fragment.html --toc /tmp/toc.html
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="description" content="Cahier de laboratoire de Yanis Amani — lecture en ligne et PDF. Module 3275.1 / 3275.2, semestre d'automne.">
          <title>Cahier de laboratoire — Yanis Amani</title>
          <style>
          :root{
            --rouge:#E30613; --rouge-fonce:#B0050F; --rouge-clair:#FDECEC;
            --noir:#111111; --gris-900:#1c1c1c; --gris-700:#444444; --gris-500:#6f6f6f;
            --gris-200:#e6e6e6; --gris-100:#f4f4f4; --fond:#ffffff; --carte:#ffffff;
            --bord:#e4e4e4; --ombre:0 18px 50px rgba(17,17,17,.10);
            --rayon:14px;
          }
          *{box-sizing:border-box}
          html{scroll-behavior:smooth}
          body{margin:0;background:var(--fond);color:var(--noir);
            font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
            font-size:1rem;line-height:1.7;min-height:100dvh;display:flex;flex-direction:column}
          /* Bandeau superieur */
          .liseret{height:6px;background:linear-gradient(90deg,var(--rouge) 0 55%,var(--noir) 55% 100%)}
          header.site{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
            backdrop-filter:blur(8px);border-bottom:1px solid var(--bord)}
          .barre{max-width:1360px;margin:0 auto;padding:.9rem 1.25rem;display:flex;
            align-items:center;gap:1rem;flex-wrap:wrap}
          .marque{display:flex;align-items:center;gap:.8rem;margin-right:auto;min-width:0}
          .logo{flex:none;width:52px;height:52px;border-radius:10px;background:var(--noir);
            color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
            line-height:1;font-weight:800;letter-spacing:.02em;position:relative;overflow:hidden}
          .logo::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:8px;background:var(--rouge)}
          .logo small{font-size:.58rem;letter-spacing:.18em;color:#fff}
          .logo b{font-size:1.05rem}
          .titres{min-width:0}
          .sur{margin:0;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rouge)}
          h1.titre{margin:.1rem 0 0;font-size:1.35rem;line-height:1.2;letter-spacing:-.01em}
          .meta{margin:.25rem 0 0;font-size:.85rem;color:var(--gris-500)}
          .meta strong{color:var(--gris-900);font-weight:600}
          /* Commandes */
          .actions{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
          .segmente{display:inline-flex;background:var(--gris-100);border:1px solid var(--bord);
            border-radius:999px;padding:3px;gap:2px}
          .segmente button{border:0;background:transparent;cursor:pointer;font:inherit;
            font-size:.88rem;font-weight:600;color:var(--gris-700);
            padding:.5rem .95rem;border-radius:999px;transition:background .15s,color .15s}
          .segmente button[aria-pressed="true"]{background:var(--noir);color:#fff}
          .segmente button:focus-visible,.bouton:focus-visible,.doc a:focus-visible{
            outline:3px solid var(--rouge);outline-offset:2px;border-radius:6px}
          .bouton{display:inline-flex;align-items:center;gap:.5rem;background:var(--rouge);
            color:#fff;text-decoration:none;padding:.6rem 1.1rem;border-radius:999px;
            font-size:.9rem;font-weight:700;box-shadow:0 8px 20px rgba(227,6,19,.28);
            transition:transform .15s,background .15s;white-space:nowrap}
          .bouton:hover{background:var(--rouge-fonce);transform:translateY(-1px)}
          main{width:100%;max-width:1360px;margin:0 auto;padding:1.6rem 1.25rem 1rem;flex:1}
          /* Zones de lecture */
          .lecture{display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem;align-items:start}
          .lecture[hidden]{display:none}
          .doc{background:var(--carte);border:1px solid var(--bord);border-radius:var(--rayon);
            box-shadow:var(--ombre);max-width:1020px;margin:0 auto;padding:3rem 3.25rem}
          /* Sommaire lateral collant (desktop) */
          .col-sommaire{display:block}
          .col-sommaire nav.toc{background:var(--carte);border:1px solid var(--bord);
            border-left:6px solid var(--noir);border-radius:12px;padding:1.1rem 1.2rem;
            box-shadow:var(--ombre);font-size:.9rem;margin:0}
          .col-sommaire nav.toc ul{list-style:none;padding-left:.9rem;margin:.35rem 0}
          .col-sommaire nav.toc>ul{padding-left:0}
          .col-sommaire nav.toc li{margin:.15rem 0}
          .col-sommaire nav.toc a{display:block;color:var(--gris-700);text-decoration:none;
            padding:.32rem .5rem;border-radius:7px;line-height:1.35;
            transition:background .15s,color .15s}
          .col-sommaire nav.toc a:hover{background:var(--gris-100);color:var(--noir)}
          .col-sommaire nav.toc a.active{background:var(--rouge-clair);color:var(--rouge-fonce);
            font-weight:700;box-shadow:inset 3px 0 0 var(--rouge)}
          .col-sommaire nav.toc a:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
          .col-sommaire .toc-titre{margin:0 0 .5rem;font-weight:800;letter-spacing:.06em;
            text-transform:uppercase;font-size:.78rem;color:var(--gris-700)}
          /* En-tetes sous le bandeau collant */
          .doc h1,.doc h2,.doc h3{scroll-margin-top:6.5rem}
          .doc>*:first-child{margin-top:0}
          .doc h1{font-size:2rem;line-height:1.2;letter-spacing:-.015em;margin:0 0 .5rem;
            border-left:8px solid var(--rouge);padding-left:.7rem}
          .doc h2{font-size:1.42rem;line-height:1.3;margin:2.4rem 0 .7rem;padding-top:1.2rem;
            border-top:1px solid var(--gris-200)}
          .doc h2 .num,.doc h1 .num{color:var(--rouge)}
          .doc h3{font-size:1.12rem;margin:1.7rem 0 .5rem;color:var(--gris-900)}
          .doc p{margin:.85rem 0;text-align:justify;hyphens:auto}
          .doc ul,.doc ol{margin:.85rem 0;padding-left:1.5rem}
          .doc li{margin:.35rem 0}
          .doc li::marker{color:var(--rouge);font-weight:700}
          .doc a{color:var(--rouge-fonce);text-underline-offset:3px;text-decoration-thickness:1.5px}
          .doc a:hover{color:var(--rouge)}
          .doc blockquote{margin:1.2rem 0;padding:.9rem 1.1rem;border-left:5px solid var(--rouge);
            background:var(--rouge-clair);border-radius:0 10px 10px 0}
          .doc pre{background:var(--noir);color:#f5f5f5;border-radius:10px;padding:1rem 1.2rem;overflow:auto}
          .doc code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}
          .doc :not(pre)>code{background:var(--gris-100);border:1px solid var(--bord);
            border-radius:6px;padding:.1em .35em}
          .doc figure,.doc img{max-width:100%}
          .doc figure{margin:1.4rem 0;text-align:center}
          .doc figcaption{font-size:.85rem;color:var(--gris-500);margin-top:.4rem}
          /* Sommaire inline (mobile / tablette) : la colonne laterale est masquee */
          .col-sommaire nav.toc{margin:0 0 1.6rem}
          .col-sommaire .toc-titre{margin:0 0 .4rem}
          /* Liens d'ancre des titres */
          .doc .ancre{color:var(--gris-200);text-decoration:none;font-size:.8em;
            margin-left:.4rem;opacity:0;transition:opacity .15s,color .15s}
          .doc h1:hover .ancre,.doc h2:hover .ancre,.doc h3:hover .ancre,
          .doc .ancre:focus-visible{opacity:1;color:var(--rouge)}
          /* Tableaux */
          .doc .table-wrap,.doc table{display:block}
          .doc table{width:100%;border-collapse:collapse;margin:1.2rem 0;font-size:.94rem;
            display:table;overflow:hidden;border-radius:10px}
          .doc .table-scroll{overflow-x:auto;margin:1.2rem -0.5rem;padding:0 .5rem}
          .doc thead th,.doc tr:first-child th,.doc tr:first-child td strong{font-weight:700}
          .doc th,.doc td{border:1px solid var(--gris-200);padding:.6em .75em;text-align:left;vertical-align:top}
          .doc thead th,.doc tr:first-child{background:var(--noir);color:#fff}
          .doc thead th a,.doc tr:first-child a{color:#fff}
          .doc tbody tr:nth-child(even),.doc tr:nth-child(even){background:#f7f7f7}
          .doc thead{position:sticky;top:0}
          /* Encadrés Objectifs / Résultats / Interprétation */
          .doc .callout{border-radius:0 10px 10px 0;margin:1.3rem 0;
            padding:1rem 1.2rem 1rem 1.3rem;border-left:6px solid var(--gris-500);
            background:#f6f6f6}
          .doc .callout-objectifs{border-left-color:var(--rouge);
            background:var(--rouge-clair)}
          .doc .callout-resultats{border-left-color:var(--noir);background:#f0f0f0}
          .doc .callout-interpretation{border-left-color:var(--gris-500);
            background:#fff;border-top:1px solid var(--bord);
            border-right:1px solid var(--bord);border-bottom:1px solid var(--bord)}
          .doc .callout-title{margin:0 0 .5rem;font-weight:800;
            letter-spacing:.04em;text-transform:uppercase;font-size:.85rem}
          .doc .callout-objectifs .callout-title{color:var(--rouge-fonce)}
          .doc .callout p:last-child{margin-bottom:0}
          /* Panneau PDF */
          .panneau-pdf{max-width:1360px;margin:0 auto}
          .panneau-pdf[hidden]{display:none}
          .cadre-pdf{background:#fff;border:1px solid var(--bord);border-radius:var(--rayon);
            box-shadow:var(--ombre);overflow:hidden}
          .cadre-pdf iframe,.cadre-pdf object{display:block;width:100%;height:min(78vh,860px);border:0;background:#2b2b2b}
          .repli{padding:1.2rem;text-align:center;font-size:.94rem;color:var(--gris-700)}
          .repli a{color:var(--rouge-fonce);font-weight:700}
          .note{max-width:1020px;margin:1rem auto 0;font-size:.9rem;color:var(--gris-500);text-align:center}
          .note a{color:var(--rouge-fonce);font-weight:600}
          footer.site{border-top:4px solid var(--noir);margin-top:1.5rem;background:#fafafa}
          .pied{max-width:1360px;margin:0 auto;padding:1.1rem 1.25rem 1.6rem;color:var(--gris-500);
            font-size:.85rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
          .pied strong{color:var(--noir)}
          @media (min-width:1000px){
            .lecture{grid-template-columns:minmax(230px,280px) minmax(0,1fr)}
            .col-sommaire{position:sticky;top:6.5rem;align-self:start;
              max-height:calc(100dvh - 8rem);overflow-y:auto;overscroll-behavior:contain}
            .col-sommaire nav.toc{margin:0;background:#fafafa;font-size:.9rem}
            .doc{max-width:none;margin:0}
          }
          @media (max-width:760px){
            .barre{padding:.8rem 1rem}
            h1.titre{font-size:1.12rem}
            .meta{font-size:.8rem}
            main{padding:1rem .8rem}
            .doc{padding:1.6rem 1.2rem;font-size:.98rem}
            .doc h1{font-size:1.5rem}
            .doc p{text-align:left}
          }
          @media print{
            .liseret,header.site,.actions,.note,.col-sommaire,footer.site{display:none}
            body{display:block}
            main{padding:0;max-width:none}
            .lecture{display:block}
            .doc{box-shadow:none;border:0;max-width:none;padding:0}
            .doc a{color:#000;text-decoration:none}
          }
          </style>
          </head>
          <body>
          <div class="liseret" aria-hidden="true"></div>
          <header class="site">
            <div class="barre">
              <div class="marque">
                <div class="logo" aria-hidden="true"><small>HE—ARC</small><b>LAB</b></div>
                <div class="titres">
                  <p class="sur">He-Arc · Cahier de laboratoire</p>
                  <h1 class="titre">Suivi de module — sécurité</h1>
                  <p class="meta"><strong>Yanis Amani</strong> · 3275.1 / 3275.2 · Semestre d'automne</p>
                </div>
              </div>
              <div class="actions">
                <div class="segmente" role="group" aria-label="Choisir le mode de lecture">
                  <button type="button" id="btn-doc" aria-pressed="true">Document</button>
                  <button type="button" id="btn-pdf" aria-pressed="false">PDF</button>
                </div>
                <a class="bouton" href="cahier.pdf" download>Télécharger le PDF</a>
              </div>
            </div>
          </header>
          <main>
            <div class="lecture" id="vue-doc">
              <aside class="col-sommaire" aria-label="Sommaire de navigation">
          HTML
          cat /tmp/toc.html >> public/index.html
          cat >> public/index.html <<'HTML'
              </aside>
              <article class="doc" aria-label="Version web du cahier">
          HTML
          cat /tmp/fragment.html >> public/index.html
          cat >> public/index.html <<'HTML'
              </article>
            </div>
            <div class="panneau-pdf" id="vue-pdf" hidden>
              <div class="cadre-pdf">
                <object data="cahier.pdf" type="application/pdf" aria-label="Visionneuse PDF du cahier">
                  <iframe src="cahier.pdf" title="Cahier de laboratoire (PDF)"></iframe>
                  <p class="repli">Votre navigateur ne peut pas afficher le PDF intégré.
                    <a href="cahier.pdf">Ouvrir le PDF</a> ou
                    <a href="cahier.pdf" download>le télécharger</a>.</p>
                </object>
              </div>
            </div>
            <p class="note">Version web générée depuis <code>main.typ</code> — le <a href="cahier.pdf" download>PDF reste la version d'archivage</a> pour impression.</p>
          </main>
          <footer class="site">
            <div class="pied">
              <span><strong>HE—ARC</strong> · Cahier de laboratoire de Yanis Amani</span>
              <span>Document compilé depuis main.typ · Lecture écran et mobile</span>
            </div>
          </footer>
          <script>
          (function(){
            var doc=document.getElementById('vue-doc'),
                pdf=document.getElementById('vue-pdf'),
                bDoc=document.getElementById('btn-doc'),
                bPdf=document.getElementById('btn-pdf');
            function show(mode,save){
              var isPdf=(mode==='pdf');
              pdf.hidden=!isPdf; doc.style.display=isPdf?'none':'';
              bPdf.setAttribute('aria-pressed',isPdf?'true':'false');
              bDoc.setAttribute('aria-pressed',isPdf?'false':'true');
              try{
                if(save!==false){try{localStorage.setItem('cahier-vue',mode);}catch(e){}}
                var u=new URL(window.location.href);
                u.searchParams.set('view',mode==='pdf'?'pdf':'doc');
                window.history.replaceState(null,'',u.toString());
              }catch(e){}
            }
            function initial(){
              try{
                var q=new URL(window.location.href).searchParams.get('view');
                if(q==='pdf'||q==='doc'){return q;}
                var s=null;try{s=localStorage.getItem('cahier-vue');}catch(e){}
                if(s==='pdf'||s==='doc'){return s;}
              }catch(e){}
              return 'doc';
            }
            bDoc.addEventListener('click',function(){show('doc');});
            bPdf.addEventListener('click',function(){show('pdf');});
            show(initial(),false);

            // Sommaire lateral : surligne la section en cours de lecture.
            var liens=Array.prototype.slice.call(
                      document.querySelectorAll('.col-sommaire nav.toc a[href^="#"]'));
            var cibles=liens.map(function(a){
              var id=decodeURIComponent(a.getAttribute('href').slice(1));
              return document.getElementById(id);
            });
            var sommaire=document.querySelector('.col-sommaire');
            var actif=null, planifie=false;
            function offsetBandeau(){
              var h=document.querySelector('header.site');
              return (h?h.getBoundingClientRect().height:0)+16;
            }
            function mettreAJour(){
              planifie=false;
              if(!liens.length||document.getElementById('vue-doc').hidden){return;}
              var seuil=offsetBandeau()+8, courant=-1;
              for(var i=0;i<cibles.length;i++){
                var el=cibles[i];
                if(el&&el.getBoundingClientRect().top<=seuil){courant=i;}else{break;}
              }
              // En bas de page, force la derniere section (petites sections finales).
              if(window.innerHeight+window.scrollY>=document.body.scrollHeight-2){
                courant=cibles.length-1;
              }
              if(courant<0){courant=0;}
              if(courant===actif){return;}
              if(actif!==null&&liens[actif]){liens[actif].classList.remove('active');
                liens[actif].removeAttribute('aria-current');}
              actif=courant;
              var lien=liens[actif];
              if(lien){
                lien.classList.add('active');
                lien.setAttribute('aria-current','true');
                if(sommaire&&sommaire.scrollHeight>sommaire.clientHeight){
                  var lh=lien.offsetTop, lb=lh+lien.offsetHeight;
                  if(lh<sommaire.scrollTop){sommaire.scrollTop=lh-8;}
                  else if(lb>sommaire.scrollTop+sommaire.clientHeight){
                    sommaire.scrollTop=lb-sommaire.clientHeight+8;
                  }
                }
              }
            }
            function planifier(){
              if(planifie){return;}
              planifie=true;
              window.requestAnimationFrame(mettreAJour);
            }
            window.addEventListener('scroll',planifier,{passive:true});
            window.addEventListener('resize',planifier,{passive:true});
            window.addEventListener('hashchange',planifier);
            mettreAJour();
          })();
          </script>
          </body>
          </html>
          HTML
          ls -lh public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
