name: Build Typst + Deploy Website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: each entry shows the date of its last commit.
          fetch-depth: 0

      - name: Run site tests
        run: |
          node --test tests/test_app_runtime.js
          python3 -m unittest tests.test_build_site tests.test_assemble_site tests.test_site_pages

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.13.1'

      - name: Compile Typst → PDF
        run: |
          mkdir -p public
          typst compile main.typ public/cahier.pdf

      - name: Generate rapport data
        run: |
          pip install xlrd -q
          python3 scripts/export_rapport.py
          ls -lh site/rapport-data.json

      - name: Generate website
        run: |
          set -e
          python3 -B - <<'PY'
          from scripts import build_site
          from scripts.assemble_site import audit_built_page

          report = audit_built_page(build_site.build_fragment()[1])
          assert report.svg_count == 15, report
          assert report.session_svg_counts.get('seance-02') == 4, report
          assert report.placeholder_count == 0, report
          print('Pre-assembly audit: 15 SVG, 4 images séance 02, 0 placeholder')
          PY
          python3 -B -m scripts.assemble_site --out public
          python3 scripts/export_figures.py --outdir public/assets/figs --workdir /tmp/diagram-wrappers
          test "$(find public/assets/figs -maxdepth 1 -type f -name '*.svg' | wc -l | tr -d ' ')" = "15"
          python3 -B - <<'PY'
          from pathlib import Path
          from scripts.assemble_site import audit_pages

          report = audit_pages(Path('public'))
          assert report.svg_count == 15, report
          assert report.session_svg_counts.get('seance-02') == 4, report
          assert report.placeholder_count == 0, report
          print('Final artifact audit: 15 SVG, 4 images séance 02, 0 placeholder')
          PY
          ls -lh public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
