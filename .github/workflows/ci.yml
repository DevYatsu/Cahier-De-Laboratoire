name: Build Typst + Deploy Website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.13.1'

      - name: Compile Typst → PDF
        run: |
          mkdir -p public
          typst compile main.typ public/cahier.pdf
          mkdir -p public/assets/figs
          for fig in figs/*.typ; do
            stem="$(basename "$fig" .typ)"
            typst compile --root . --format svg "$fig" "public/assets/figs/$stem.svg"
          done
          ls -lh public/ public/assets/figs/

      - name: Generate website
        run: |
          python3 scripts/build_site.py -o /tmp/fragment.html --toc /tmp/toc.html
          python3 scripts/assemble_site.py --toc /tmp/toc.html --fragment /tmp/fragment.html --out public/index.html
          # Flatten each séance's assets under public/assets/<seance-dir>/ so
          # that "assets/foo.jpg" references resolve on the deployed site.
          for assets in seances/*/assets; do
            [ -d "$assets" ] || continue
            seance="$(basename "$(dirname "$assets")")"
            mkdir -p "public/assets/$seance"
            cp -R "$assets/." "public/assets/$seance/"
          done
          ls -lh public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
