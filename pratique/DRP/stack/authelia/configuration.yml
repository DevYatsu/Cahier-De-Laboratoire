# Authelia : fournisseur d'identité (SSO) du stack. Les secrets viennent de fichiers (variables *_FILE).
server:
  address: "tcp://0.0.0.0:9091"

log:
  level: info
  format: json

theme: auto

authentication_backend:
  # Comptes dans un fichier (mots de passe hachés en argon2id), généré par init-secrets.sh.
  file:
    path: /run/secrets/authelia/users.yml
    watch: false
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    - domain: "*.drp.localhost"
      policy: one_factor

session:
  cookies:
    - domain: drp.localhost
      authelia_url: "https://auth.drp.localhost:8443"
      default_redirection_url: "https://grafana.drp.localhost:8443"
  expiration: 1h
  inactivity: 15m

# Anti brute-force : 5 échecs en 2 minutes, compte bloqué 10 minutes.
regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 10m

storage:
  # Base chiffrée par AUTHELIA_STORAGE_ENCRYPTION_KEY : sans cette clé, une sauvegarde de la base est illisible.
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notifications.txt
