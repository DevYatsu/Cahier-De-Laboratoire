global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/regles.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Un réseau privé par backend : Prometheus ne les joint pas directement, il passe par Traefik (entrée « scrape »).
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
  - job_name: traefik
    static_configs: [{targets: ["traefik:8082"]}]
  - job_name: loki-gate
    static_configs: [{targets: ["loki-gate:8082"]}]
  - job_name: loki
    metrics_path: /loki/metrics
    static_configs: [{targets: ["loki-gate:9100"]}]
  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs: [{targets: ["traefik:9100"]}]
  - job_name: cadvisor
    metrics_path: /cadvisor/metrics
    static_configs: [{targets: ["traefik:9100"]}]
  - job_name: alloy
    metrics_path: /alloy/metrics
    static_configs: [{targets: ["traefik:9100"]}]
  - job_name: juice-shop
    metrics_path: /juice-shop/metrics
    static_configs: [{targets: ["traefik:9100"]}]
