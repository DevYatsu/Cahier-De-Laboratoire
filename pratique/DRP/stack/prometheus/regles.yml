groups:
  - name: supervision
    rules:
      # Toujours active : Alertmanager la relaie chaque minute au heartbeat externe.
      # Si elle n'arrive plus, c'est toute la chaîne d'alerte qui est tombée.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog : la chaîne d'alerte fonctionne"
      - alert: CibleInjoignable
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} ne répond plus au scrape"
      # Plus aucun log reçu par Loki : collecte arrêtée, ou attaquant qui la coupe (exercice 1, T+20).
      - alert: LogsAbsents
        expr: sum(rate(loki_distributor_lines_received_total[5m])) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Loki ne reçoit plus de logs depuis 5 minutes"
      # La copie WORM échoue : les preuves ne sont plus protégées contre l'effacement.
      - alert: CopieWORMEnEchec
        expr: sum(rate(otelcol_exporter_send_failed_log_records_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alloy n'arrive plus à copier les logs vers le stockage WORM"
