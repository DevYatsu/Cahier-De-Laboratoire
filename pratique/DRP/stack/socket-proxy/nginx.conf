# socket-proxy : seul service à monter le socket Podman. Repris de stack-04 (podman-proxy),
# mais servi en TCP sur le réseau docker-api (internal) au lieu d'un socket partagé.
user root;
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;

    server {
        listen 2375;

        # Logs et événements en continu : pas de tampon, connexion longue.
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_read_timeout 1d;

        # Sécurité : seules les routes de lecture utiles à Traefik, Alloy et cAdvisor, en GET.
        location ~ ^(/v[0-9.]+)?/(_ping|info|version|events|networks|containers/json|containers/[0-9a-zA-Z_.-]+/(json|logs))$ {
            limit_except GET { deny all; }
            proxy_pass http://unix:/var/run/podman/podman.sock:;
        }

        location / {
            return 403;
        }
    }
}
