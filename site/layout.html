<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<script>
try{var t=localStorage.getItem('cahier-theme');
if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
document.documentElement.dataset.theme=t;}catch(e){}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B2A41'/%3E%3Crect y='25' width='32' height='7' fill='%23E30613'/%3E%3Ctext x='16' y='20' font-family='Georgia,serif' font-size='15' font-weight='700' text-anchor='middle' fill='white'%3ECL%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="{{page_class}}">
<a class="saut" href="#contenu">Aller au contenu</a>
<header class="topbar">
  <button type="button" class="icone-bouton menu" id="btn-menu" aria-controls="sidebar" aria-expanded="false" aria-label="Ouvrir la navigation">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="marque" href="index.html">
    <span class="marque-logo" aria-hidden="true">CL</span>
    <span class="marque-texte"><b>Cahier de laboratoire</b><small>{{author}} · {{module}}</small></span>
  </a>
  <button type="button" class="recherche-bouton" data-search-open aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Rechercher dans le cahier…</span>
    <kbd>Ctrl K</kbd>
  </button>
  <div class="topbar-actions">
    <a class="bouton-ligne" href="cahier.pdf" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 15h6M9 18h4"/></svg>
      <span>PDF</span>
    </a>
    <button type="button" class="icone-bouton" id="btn-theme" aria-label="Basculer le thème clair ou sombre">
      <svg class="si-clair" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="si-sombre" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<div class="voile" id="voile" hidden></div>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Navigation du cahier">
{{sidebar}}
  </aside>
  <main id="contenu" tabindex="-1">
{{main}}
    <footer class="pied">
      <p>{{author}} · HE-Arc Ingénierie · {{module}}</p>
      <p>Généré automatiquement depuis les sources Typst le <time datetime="{{build_iso}}">{{build_date}}</time>, révision <a href="{{commit_url}}"><code>{{commit}}</code></a>.</p>
    </footer>
  </main>
  <aside class="rail" aria-label="Sur cette page">
{{rail}}
  </aside>
</div>
<dialog class="recherche" id="recherche" aria-label="Rechercher dans le cahier">
  <form method="dialog" class="recherche-champ" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="recherche-input" autocomplete="off" spellcheck="false"
      placeholder="Chercher une notion, une norme, une activité…" aria-label="Termes recherchés"
      aria-controls="recherche-resultats" aria-describedby="recherche-etat">
    <button type="submit" class="touche" aria-label="Fermer la recherche">Échap</button>
  </form>
  <p class="recherche-etat" id="recherche-etat" role="status" aria-live="polite"></p>
  <ul class="recherche-resultats" id="recherche-resultats" role="listbox" aria-label="Résultats"></ul>
  <p class="recherche-aide"><kbd>↑</kbd><kbd>↓</kbd> naviguer · <kbd>Entrée</kbd> ouvrir · <kbd>Échap</kbd> fermer</p>
</dialog>
<dialog class="loupe" id="loupe" aria-label="Figure agrandie">
  <form method="dialog"><button type="submit" class="icone-bouton loupe-fermer" aria-label="Fermer la figure">×</button></form>
  <img id="loupe-image" alt="">
  <p id="loupe-legende"></p>
</dialog>
<script src="app.js" defer></script>
{{scripts}}
</body>
</html>
