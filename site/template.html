<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Cahier de laboratoire de Yanis Amani - lecture en ligne et PDF. Module 3275.1 / 3275.2, semestre d'automne.">
<title>Cahier de laboratoire - Yanis Amani</title>
<script>
try{var t=null;try{t=localStorage.getItem('cahier-theme');}catch(e){}
if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
if(t==='dark'){document.documentElement.dataset.theme='dark';}}catch(e){}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="saut" id="saut-region" href="#index-seances">Aller à l’index des séances</a>
<div class="liseret" aria-hidden="true"></div>
<header class="site">
  <div class="barre">
    <div class="marque">
      <div class="logo" aria-hidden="true"><small>HE-ARC</small><b>LAB</b></div>
      <div class="titres">
        <p class="sur">He-Arc · Cahier de laboratoire</p>
        <h1 class="titre">Suivi de module - sécurité</h1>
        <p class="meta"><strong>Yanis Amani</strong> · 3275.1 / 3275.2 · Semestre d'automne</p>
      </div>
    </div>
    <div class="actions">
      <div class="segmente" role="group" aria-label="Choisir le mode de lecture">
        <button type="button" id="btn-doc" aria-pressed="true">Document</button>
        <button type="button" id="btn-pdf" aria-pressed="false">PDF</button>
        <button type="button" id="btn-rapport" aria-pressed="false">Rapport d'activité</button>
      </div>
      <button type="button" id="btn-theme" class="theme" aria-pressed="false" aria-label="Activer le thème sombre">
        <svg class="icon-light" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-dark" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </div>
</header>
<main>
  <div class="note" id="seance-erreur" role="alert" hidden>
    <p id="seance-erreur-texte"></p>
    <button type="button" id="btn-toutes" class="bouton">Voir toutes les séances</button>
  </div>
  <section id="index-seances" aria-labelledby="titre-index-seances" tabindex="-1">
    <h2 id="titre-index-seances">Choisir une séance</h2>
    <ul id="liste-seances" aria-labelledby="titre-index-seances"></ul>
  </section>
  <div class="toc-barre" id="toc-barre" hidden>
    <button type="button" id="btn-toc" class="toc-bouton" aria-expanded="false" aria-controls="sommaire">Sommaire <span class="fleche" aria-hidden="true">▾</span></button>
  </div>
  <div class="lecture" id="vue-doc" hidden>
    <aside class="col-sommaire" id="sommaire" aria-label="Sommaire de navigation">
      <div class="recherche" role="search">
        <label class="recherche-label" for="recherche">Rechercher dans le sommaire</label>
        <input type="search" id="recherche" name="recherche" autocomplete="off"
          placeholder="Filtrer le sommaire…" aria-label="Filtrer le sommaire par mot-clé"
          aria-describedby="recherche-compte">
        <p class="recherche-compte" id="recherche-compte" role="status" aria-live="polite"></p>
      </div>
<!--TOC-->
    </aside>
    <article class="doc" id="contenu" aria-label="Version web du cahier" tabindex="-1">
<!--FRAGMENT-->
    </article>
  </div>
  <nav class="seances" id="nav-seances" aria-label="Navigation entre les séances" hidden>
    <button type="button" id="btn-index" class="bouton">Toutes les séances</button>
    <a class="seance-lien" id="seance-prec" href="#">← <span></span></a>
    <label class="seance-saut">Aller à la séance
      <select id="seance-select">
        <option value="">Toutes les séances</option>
      </select>
    </label>
    <a class="seance-lien" id="seance-suiv" href="#"><span></span> →</a>
  </nav>
  <div class="panneau-pdf" id="vue-pdf" tabindex="-1" hidden>
    <div class="cadre-pdf">
      <object data="cahier.pdf" type="application/pdf" aria-label="Visionneuse PDF du cahier">
        <iframe src="cahier.pdf" title="Cahier de laboratoire (PDF)"></iframe>
        <p class="repli">Votre navigateur ne peut pas afficher le PDF intégré.
          <a href="cahier.pdf">Ouvrir le PDF</a> ou
          <a href="cahier.pdf" download>le télécharger</a>.</p>
      </object>
    </div>
  </div>
</main>
<footer class="site">
  <div class="pied">
    <span><strong>HE-ARC</strong> · Cahier de laboratoire de Yanis Amani</span>
  </div>
</footer>
<script src="app.js" defer></script>
</body>
</html>
